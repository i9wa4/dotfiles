presets:
  main:
    name: main
    description: main control plane
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - name: caffeinate
          command: caffeinate -i
          delay: 500
          focus: true
        - name: vde-monitor
          command: sh -c 'rm -rf -- "$HOME/.vde-monitor/panes" && exec vde-monitor --tailscale'  # startup prunes only disposable pane logs; durable vde-monitor state stays preserved
          delay: 500

  dev:
    name: dev
    description: dev
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - name: pane
          title: editor
          delay: 500
          focus: true
        - name: agent
          title: agent
          command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=medium
          delay: 500

  env-a:
    name: env-a
    description: codex-featured private team
    windowMode: new-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - type: vertical
          ratio: [1, 1, 1, 1]
          panes:
            - name: messenger
              title: messenger
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-luna --config model_reasoning_effort=high
              delay: 500
            - name: coordinator
              title: coordinator
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=high
              delay: 500
            - name: builder
              title: builder
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=medium
              delay: 500
            - name: builder-alt
              title: builder-alt
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=medium
              delay: 500
        - type: vertical
          ratio: [1, 1, 1]
          panes:
            - name: approver
              title: approver
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-luna --config model_reasoning_effort=high
              delay: 500
            - name: review-lead
              title: review-lead
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=high
              delay: 500
            - name: review-peer
              title: review-peer
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-5.6-sol --config model_reasoning_effort=high
              delay: 500

  env-b:
    name: env-b
    description: Claude-team review mapping with a Codex review-peer
    windowMode: new-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - type: vertical
          ratio: [1, 1, 1, 1]
          panes:
            - name: messenger
              title: messenger
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-luna --config model_reasoning_effort=high
              delay: 500
            - name: coordinator
              title: coordinator
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model "opus[1m]" --effort high
              delay: 500
            - name: builder
              title: builder
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=medium
              delay: 500
            - name: builder-alt
              title: builder-alt
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model sonnet --effort medium
              delay: 500
        - type: vertical
          ratio: [1, 1, 1]
          panes:
            - name: approver
              title: approver
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model sonnet --effort medium
              delay: 500
            - name: review-lead
              title: review-lead
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model "opus[1m]" --effort high
              delay: 500
            - name: review-peer
              title: review-peer
              command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=high
              delay: 500
