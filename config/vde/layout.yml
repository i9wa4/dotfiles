presets:
  main:
    name: main
    description: main control plane, review_first state
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - name: postman
          command: tmux-a2a-postman start  # tmux-a2a-postman control-plane state is review_first
          delay: 500
          focus: true
        - name: vde-monitor
          command: sh -c 'rm -rf -- "$HOME/.vde-monitor/panes" && exec vde-monitor --tailscale'  # startup prunes only disposable pane logs; durable vde-monitor state stays preserved
          delay: 500

  dev:
    name: dev
    description: dev
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - name: pane
          title: editor
          delay: 500
          focus: true
        - name: agent
          title: agent
          command: codex --yolo --no-alt-screen --model gpt-5.5 --config model_reasoning_effort=high
          delay: 500

  preset-p:
    name: preset-p
    description: codex-featured private team
    windowMode: new-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - type: vertical
          ratio: [1, 1, 1, 1]
          panes:
            - name: messenger
              title: messenger
              command: codex --yolo --no-alt-screen --model gpt-5.6-terra --config model_reasoning_effort=medium
              delay: 500
            - name: orchestrator
              title: orchestrator
              command: codex --yolo --no-alt-screen --model gpt-5.6-sol --config model_reasoning_effort=medium
              delay: 500
            - name: worker
              title: worker
              command: codex --yolo --no-alt-screen --model gpt-5.6-terra --config model_reasoning_effort=medium
              delay: 500
            - name: worker-alt
              title: worker-alt
              command: codex --yolo --no-alt-screen --model gpt-5.5 --config model_reasoning_effort=medium
              delay: 500
        - type: vertical
          ratio: [1, 1, 1, 1]
          panes:
            - name: approver
              title: approver
              command: codex --yolo --no-alt-screen --model gpt-5.5 --config model_reasoning_effort=medium
              delay: 500
            - name: guardian
              title: guardian
              command: codex --yolo --no-alt-screen --model gpt-5.6-sol --config model_reasoning_effort=high
              delay: 500
            - name: critic
              title: critic
              command: codex --yolo --no-alt-screen --model gpt-5.5 --config model_reasoning_effort=high
              delay: 500
            - name: diplomat
              title: diplomat
              command: codex --yolo --no-alt-screen --model gpt-5.6-terra --config model_reasoning_effort=medium
              delay: 500

  preset-w:
    name: preset-w
    description: Claude-team review mapping with a Codex critic
    windowMode: new-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - type: vertical
          ratio: [1, 1, 1, 1]
          panes:
            - name: messenger
              title: messenger
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model sonnet --effort medium
              delay: 500
            - name: orchestrator
              title: orchestrator
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model sonnet --effort medium
              delay: 500
            - name: worker
              title: worker
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model sonnet --effort medium
              delay: 500
            - name: worker-alt
              title: worker-alt
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model sonnet --effort medium
              delay: 500
        - type: vertical
          ratio: [1, 1, 1, 1]
          panes:
            - name: approver
              title: approver
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model sonnet --effort medium
              delay: 500
            - name: guardian
              title: guardian
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model "opus[1m]" --effort high
              delay: 500
            - name: critic
              title: critic
              command: codex --yolo --no-alt-screen --model gpt-5.5 --config model_reasoning_effort=medium
              delay: 500
            - name: diplomat
              title: diplomat
              command: claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model sonnet --effort medium
              delay: 500
