name: stay-lazy-eval
description: Offline trigger checks across ordinary work and explicit opt-out.
skill: stay-lazy
version: "1.1"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the skill route as expected?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did it stay within behavior limits?
tasks:
  - "tasks/*.yaml"
