presets:
  main:
    name: main
    description: main control plane, review_first state
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - name: postman
          command: printf "Postman is daemonless. Start a team preset; use get-status in a configured role pane.\n"
          delay: 500
          focus: true
        - name: vde-monitor
          command: sh -c 'rm -rf -- "$HOME/.vde-monitor/panes" && exec vde-monitor --tailscale'  # startup prunes only disposable pane logs; durable vde-monitor state stays preserved
          delay: 500

  dev:
    name: dev
    description: dev
    windowMode: current-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - name: pane
          title: editor
          delay: 500
          focus: true
        - name: agent
          title: agent
          command: codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=medium
          delay: 500

  preset-p:
    name: preset-p
    description: codex-featured private team
    windowMode: new-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - type: vertical
          ratio: [1, 1, 1, 1]
          panes:
            - name: messenger
              title: messenger
              command: postman-agent messenger -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-luna --config model_reasoning_effort=high @postman-prompt
              delay: 500
            - name: orchestrator
              title: orchestrator
              command: postman-agent orchestrator -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=high @postman-prompt
              delay: 500
            - name: worker
              title: worker
              command: postman-agent worker -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=medium @postman-prompt
              delay: 500
            - name: worker-alt
              title: worker-alt
              command: postman-agent worker-alt -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=medium @postman-prompt
              delay: 500
        - type: vertical
          ratio: [1, 1, 1]
          panes:
            - name: approver
              title: approver
              command: postman-agent approver -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-luna --config model_reasoning_effort=high @postman-prompt
              delay: 500
            - name: guardian
              title: guardian
              command: postman-agent guardian -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=high @postman-prompt
              delay: 500
            - name: critic
              title: critic
              command: postman-agent critic -- codex --yolo --no-alt-screen --no-daemon --model gpt-5.6-sol --config model_reasoning_effort=high @postman-prompt
              delay: 500

  preset-w:
    name: preset-w
    description: Claude-team review mapping with a Codex critic
    windowMode: new-window
    layout:
      type: horizontal
      ratio: [1, 1]
      panes:
        - type: vertical
          ratio: [1, 1, 1, 1]
          panes:
            - name: messenger
              title: messenger
              command: postman-agent messenger -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-luna --config model_reasoning_effort=high @postman-prompt
              delay: 500
            - name: orchestrator
              title: orchestrator
              command: postman-agent orchestrator -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=medium @postman-prompt
              delay: 500
            - name: worker
              title: worker
              command: postman-agent worker -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-luna --config model_reasoning_effort=high @postman-prompt
              delay: 500
            - name: worker-alt
              title: worker-alt
              command: postman-agent worker-alt -- claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model sonnet --effort medium @postman-prompt
              delay: 500
        - type: vertical
          ratio: [1, 1, 1]
          panes:
            - name: approver
              title: approver
              command: postman-agent approver -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-luna --config model_reasoning_effort=high @postman-prompt
              delay: 500
            - name: guardian
              title: guardian
              command: postman-agent guardian -- codex --yolo --no-alt-screen --no-daemon --model gpt-6-sol --config model_reasoning_effort=high @postman-prompt
              delay: 500
            - name: critic
              title: critic
              command: postman-agent critic -- claude --allow-dangerously-skip-permissions --dangerously-skip-permissions --model "opus[1m]" --effort medium @postman-prompt
              delay: 500
